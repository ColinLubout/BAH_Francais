# Coverage is reported on every PR. The spec's target, at least 90%, applies to
# the domain layer: CI enforces it (tool/check_domain_coverage.dart) and the
# domain component below reports it. Overall coverage is informational.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

component_management:
  individual_components:
    - component_id: domain
      name: Domain layer
      paths:
        - lib/features/**/domain/**
      statuses:
        - type: project
          target: 90%

ignore:
  - "**/*.g.dart"
