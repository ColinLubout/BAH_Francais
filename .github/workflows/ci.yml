name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  checks:
    name: Analyze, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Strings class is up to date
        run: |
          dart run tool/gen_strings.dart
          git diff --exit-code -- lib/core/strings.g.dart || {
            echo "::error::lib/core/strings.g.dart is out of date. Run: dart run tool/gen_strings.dart"
            exit 1
          }

      - name: Generate code (Riverpod, Drift)
        run: dart run build_runner build

      - name: Content is valid and builds a pack
        run: |
          dart run tool/content_build.dart content --out build/content/content-pack.sqlite
          dart run tool/content_build.dart content/sample --out build/content/sample-pack.sqlite

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Domain coverage at least 90%
        run: dart run tool/check_domain_coverage.dart coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/lcov.info

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --debug

  ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build ios --debug --no-codesign
