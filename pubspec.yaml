name: bah_francais
description: "Learn and maintain French through short, self-paced drills with spaced repetition."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2
  # CI pins the exact version in .github/workflows/ci.yml.
  flutter: ">=3.47.2"

dependencies:
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.2.0
  go_router: ^18.0.1
  meta: ^1.19.0
  riverpod_annotation: ^4.0.7
  sqlite3: ^3.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  json_schema: ^5.2.2
  mocktail: ^1.0.5
  path: ^1.9.1
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0
  xml: ^7.0.0

flutter:
  uses-material-design: true

  assets:
    # Registered with the licence page at start-up (see lib/app/licences.dart).
    - assets/fonts/OFL.txt
    - assets/licences/py-fsrs.txt
    # The content pack every build ships with, imported on the first launch.
    # Built from content/ (see content/README.md); a test checks it matches.
    - assets/content/content-pack.sqlite

  # Bundled, never fetched at runtime, so the app stays offline.
  # Only these three weights exist: the theme never asks for any other.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
