targets:
  $default:
    builders:
      # Drift's modular build: each file declaring tables, DAOs or a database
      # gets its own .drift.dart, so the app database and the content pack
      # (tool/content_build.dart) share one set of generated table classes.
      drift_dev:
        enabled: false
        # Also read by `dart run drift_dev make-migrations`, which dumps each
        # schema version and generates the migration test helpers.
        options: &drift_options
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
      drift_dev:analyzer:
        enabled: true
        options: *drift_options
      drift_dev:modular:
        enabled: true
        options: *drift_options
